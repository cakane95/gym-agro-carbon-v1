[project]
name = "contextual-stat-rl"
version = "0.1.0"
description = "A Gym environment connecting GAMA ABM for Contextual MDP instantiation"
authors = [
    {name = "The GymAgroCarbon Authors"}
]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "numpy (==1.24.3)",
    "statisticalrl (==2.2507)",
    "gama-client (>=1.2.4,<2.0.0)",
    "gama-gymnasium (>=1.0.1,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pandas (>=2.0,<2.2)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
